name: Deploy LIFE707 book to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install the book builder
        run: |
          python -m venv .venv
          .venv/bin/pip install -r jupyter_book/requirements.txt
      - name: Build the book
        env:
          BASE_URL: "/${{ github.event.repository.name }}"
          JB_ALLOW_NODEENV: "yes"
        run: |
          set -o pipefail
          .venv/bin/python jupyter_book/build_book.py build 2>&1 | tee build.log
      - name: Publish build diagnostics
        if: failure()
        run: |
          {
            echo "### LIFE707 book build failure"
            echo '```text'
            tail -n 200 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: jupyter_book/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
